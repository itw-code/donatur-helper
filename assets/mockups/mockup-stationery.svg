      <circle cx="102" cy="80" r="22" fill="#334155" />
      <path d="M72 135 C72 110 88 102 102 102 C116 102 132 110 132 135 Z" fill="#334155" />

      <!-- Name & Role -->
      <text x="102" y="172" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Ahmad Fauzi</text>
      <text x="102" y="188" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#34D399">PIC RELAWAN SAWITPRO</text>
      <text x="102" y="202" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#CBD5E1">ID: DH-PIC-SAWITPRO-084</text>

      <!-- Mini QR code -->
      <rect x="82" y="220" width="40" height="40" rx="4" fill="#FFFFFF" />
      <rect x="86" y="224" width="12" height="12" fill="#0F172A" />
      <rect x="106" y="224" width="12" height="12" fill="#0F172A" />
      <rect x="86" y="244" width="12" height="12" fill="#0F172A" />
      <text x="102" y="274" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6" font-weight="600" fill="#94A3B8">VALIDASI MANDAT</text>
    </g>
  </g>

  <!-- Item 3: Business Cards (Front & Back Overlapping) -->
  <g transform="translate(850, 140)" filter="url(#sceneShadow)">
    <!-- Back Card (Angled) -->
    <g transform="rotate(8)">
