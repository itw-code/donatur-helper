<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="none">
  <defs>
    <linearGradient id="woodDesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C0F" />
      <stop offset="50%" stop-color="#0B1318" />
      <stop offset="100%" stop-color="#05080A" />
    </linearGradient>
    <filter id="sceneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#woodDesk)" />
  <circle cx="900" cy="200" r="500" fill="#10B981" opacity="0.08" />

  <!-- Title Header Label -->
  <g transform="translate(60, 45)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Mockup Perlengkapan Fisik &amp; Administrasi DonatPRO</text>
    <text x="0" y="44" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#9DB4AA">Implementasi nyata Kop Surat Resmi, ID Badge Relawan Lanyard, Kartu Nama PIC, dan Kuitansi Sah.</text>
  </g>

  <!-- Item 1: Printed A4 Letterhead (Angled on Left) -->
  <g transform="translate(70, 110) rotate(-2)" filter="url(#sceneShadow)">
    <rect width="420" height="590" rx="6" fill="#FFFFFF" />
    <!-- Letterhead Top Stripe -->
    <rect x="0" y="0" width="420" height="5" fill="#10B981" />
    <g transform="translate(24, 20)">
      <circle cx="12" cy="12" r="10" fill="#10B981" />
      <text x="30" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0F172A">Donat<tspan fill="#10B981">PRO</tspan></text>
      <text x="30" y="26" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#64748B">SOLIDARITAS INSAN SAWITPRO</text>
      <line x1="0" y1="36" x2="372" y2="36" stroke="#0F172A" stroke-width="1" />

      <!-- Body simulation lines -->
      <text x="0" y="60" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#0F172A">Laporan Pertanggungjawaban DonatPRO</text>
      <rect x="0" y="75" width="370" height="4" rx="2" fill="#E2E8F0" />
      <rect x="0" y="85" width="350" height="4" rx="2" fill="#E2E8F0" />
      <rect x="0" y="95" width="360" height="4" rx="2" fill="#E2E8F0" />
      <rect x="0" y="105" width="320" height="4" rx="2" fill="#E2E8F0" />

      <rect x="0" y="125" width="370" height="40" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="142" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#059669">TOTAL PENYALURAN: RP 24.500.000,- (100% SAH)</text>

      <rect x="0" y="180" width="370" height="4" rx="2" fill="#E2E8F0" />
      <rect x="0" y="190" width="340" height="4" rx="2" fill="#E2E8F0" />

      <!-- Official Stamp on Letterhead -->
      <circle cx="280" cy="460" r="28" stroke="#10B981" stroke-width="1.5" stroke-dasharray="2,2" fill="none" opacity="0.8" />
      <text x="280" y="458" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="800" fill="#10B981">DONATPRO</text>
      <text x="280" y="468" text-anchor="middle" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#10B981">SAWITPRO</text>
    </g>
  </g>

  <!-- Item 2: ID Badge with Woven Emerald Lanyard (Center Right) -->
  <g transform="translate(540, 110)" filter="url(#sceneShadow)">
    <!-- Woven Emerald Lanyard Ribbon -->
    <path d="M120 0 C120 -60 180 -60 180 0 L180 60 L120 60 Z" fill="#059669" />
    <path d="M150 0 L150 60" stroke="#34D399" stroke-width="2" stroke-dasharray="4,4" fill="none" />
    <!-- Metal Clip & Swivel Hook -->
    <rect x="135" y="55" width="30" height="18" rx="3" fill="#94A3B8" />
    <circle cx="150" cy="78" r="6" stroke="#94A3B8" stroke-width="3" fill="none" />

    <!-- Acrylic Card Holder -->
    <rect x="30" y="86" width="240" height="380" rx="14" fill="#081014" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <rect x="125" y="96" width="50" height="8" rx="4" fill="#000000" />

    <g transform="translate(48, 120)">
      <circle cx="12" cy="12" r="10" fill="#10B981" />
      <text x="30" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Donat<tspan fill="#34D399">PRO</tspan></text>
      
      <!-- Photo Frame -->
