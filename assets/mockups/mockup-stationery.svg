      <text x="18" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Ahmad Fauzi</text>
      <text x="18" y="46" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#34D399">Koordinator PIC SawitPRO</text>
      <text x="18" y="80" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#EEF6F1">📱 +62 812-8888-0192</text>
      <text x="18" y="96" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#EEF6F1">✉️ fauzi@sawitpro.com</text>
      <text x="18" y="112" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#EEF6F1">🌐 don4tpro.pages.dev</text>

      <rect x="188" y="80" width="54" height="54" rx="4" fill="#FFFFFF" />
      <rect x="194" y="86" width="16" height="16" fill="#0F172A" />
      <rect x="220" y="86" width="16" height="16" fill="#0F172A" />
      <rect x="194" y="112" width="16" height="16" fill="#0F172A" />
    </g>
  </g>

  <!-- Item 4: Official Stamped Receipt Voucher (Bottom Right) -->
  <g transform="translate(520, 480) rotate(1)" filter="url(#sceneShadow)">
    <rect width="580" height="260" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="0" y="0" width="10" height="260" rx="5" fill="#10B981" />

    <g transform="translate(30, 24)">
      <circle cx="12" cy="12" r="10" fill="#10B981" />
      <text x="30" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F172A">Donat<tspan fill="#10B981">PRO</tspan></text>
      <text x="30" y="28" font-family="'Inter', sans-serif" font-size="6.5" font-weight="700" fill="#64748B">KUITANSI RESMI SOLIDARITAS SAWITPRO</text>
      <text x="520" y="18" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#059669">NO: KWT/DPRO/0812</text>

      <line x1="0" y1="40" x2="520" y2="40" stroke="#E2E8F0" stroke-width="1" />

      <text x="0" y="65" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">Telah Terima Dari :</text>
      <text x="110" y="65" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">Rekan Karyawan SawitPRO (#SP-8821)</text>

      <text x="0" y="90" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">Uang Sejumlah   :</text>
      <rect x="110" y="78" width="280" height="18" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="0.75" />
      <text x="118" y="90" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#065F46"># Lima Ratus Ribu Rupiah #</text>

      <!-- Big Highlight Box -->
      <rect x="0" y="130" width="220" height="55" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2" />
      <text x="14" y="150" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#64748B">TOTAL VALIDASI PIC</text>
      <text x="14" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#0F172A">Rp 500.000,-</text>

      <!-- Red Stamp -->
      <circle cx="380" cy="155" r="30" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="2,2" fill="none" opacity="0.8" />
      <text x="380" y="152" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#DC2626">DONATPRO</text>
      <text x="380" y="162" text-anchor="middle" font-family="'Inter', sans-serif" font-size="6" font-weight="700" fill="#DC2626">LUNAS &amp; SAH</text>

      <text x="470" y="180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#0F172A">Ahmad Fauzi (PIC)</text>
    </g>
