# Supabase Free-plan keep-alive Worker.
#
# Supabase pauses Free-plan projects that receive too few user database queries
# over a 7-day window (https://supabase.com/docs/guides/platform/free-project-pausing).
# Only queries that actually reach Postgres count, so hitting the project root or
# `GET /rest/v1/` is not reliable. This Worker issues a real, read-only RPC call
# three times a week — comfortably inside the 7-day window.
#
# Deploy:  cd workers/supabase-keepalive && npx wrangler deploy
# Secrets: npx wrangler secret put SUPABASE_URL
#          npx wrangler secret put SUPABASE_PUBLISHABLE_KEY

name = "donatur-helper-supabase-keepalive"
main = "src/index.js"
compatibility_date = "2026-09-01"

# No route/custom domain: the Worker is triggered only by its Cron Trigger and
# by manual `wrangler dev`/fetch. It is not part of the don4tpro Pages site.
workers_dev = true

[triggers]
crons = ["0 9 * * 1,3,5"]
