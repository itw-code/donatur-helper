# Netlify configuration to redirect all traffic from the Netlify site to the Cloudflare Pages site, avoiding redirect loops.
# Redirect only when the request host matches the Netlify domain.

[[redirects]]
  from = "/*"
  to = "https://don4tpro.pages.dev/:splat"
  status = 301
  force = true
  conditions = { Host = ["don4tpro.netlify.app"] }
